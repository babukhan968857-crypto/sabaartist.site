<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Saba Mehndi Artist</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-white min-h-screen">

    <header class="p-6 bg-black flex justify-between items-center border-b border-yellow-600">
        <!-- यहाँ 'SABA MEHNDI' पर 5 बार लगातार क्लिक करें -->
        <h1 class="text-2xl font-bold text-yellow-500 cursor-pointer" onclick="openAdmin()">SABA MEHNDI</h1>
    </header>

    <section class="p-8 text-center bg-zinc-800">
        <h2 class="text-4xl font-serif text-yellow-500 mb-4">Exquisite Mehndi Artistry</h2>
        <p class="text-gray-300">Tikri Mod, Azad Nagar, Aurangabad, Bihar</p>
    </section>

    <div class="p-8 max-w-6xl mx-auto">
        <h3 class="text-2xl text-yellow-500 mb-6 border-b border-gray-700 pb-2">Our Design Gallery</h3>
        <div id="galleryGrid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-6"></div>
    </div>

    <!-- Admin Panel Modal -->
    <div id="adminModal" class="hidden fixed inset-0 bg-black/90 p-6 overflow-y-auto z-50 flex justify-center items-center">
        <div class="bg-gray-800 p-6 rounded-lg max-w-md w-full border border-yellow-500">
            <div class="flex justify-between items-center mb-4">
                <h3 class="text-xl text-yellow-500 font-bold">Admin Panel</h3>
                <button onclick="closeAdmin()" class="bg-red-600 text-white px-3 py-1 rounded">Close X</button>
            </div>
            
            <div class="space-y-4">
                <div>
                    <label class="block text-sm mb-1">Select Photo:</label>
                    <input type="file" id="imgFile" accept="image/*" class="w-full bg-gray-700 p-2 rounded text-sm">
                </div>
                <div>
                    <label class="block text-sm mb-1">Design Name:</label>
                    <input type="text" id="imgTitle" placeholder="e.g. Bridal Mehndi" class="w-full bg-gray-700 p-2 rounded text-black bg-white">
                </div>
                <div>
                    <label class="block text-sm mb-1">Price:</label>
                    <input type="text" id="imgPrice" placeholder="e.g. ₹3000" class="w-full bg-gray-700 p-2 rounded text-black bg-white">
                </div>
                <button onclick="savePhoto()" class="w-full bg-yellow-500 text-black font-bold py-2 rounded hover:bg-yellow-400">Upload to Website</button>
            </div>

            <div class="mt-6 border-t border-gray-700 pt-4">
                <h4 class="text-sm font-bold text-yellow-400 mb-2">Manage Photos:</h4>
                <div id="adminList" class="space-y-2 max-h-40 overflow-y-auto"></div>
            </div>
        </div>
    </div>

    <script>
        let gallery = JSON.parse(localStorage.getItem('sabaGalleryData')) || [
            { title: "Bridal Special", price: "₹5,000", src: "https://images.unsplash.com/photo-1610173827050-b447dd498e6c?auto=format&fit=crop&w=500&q=80" }
        ];

        let clicks = 0;
        function openAdmin() {
            clicks++;
            if(clicks === 5) {
                let pin = prompt("Enter PIN:");
                if(pin === "1234") {
                    document.getElementById('adminModal').classList.remove('hidden');
                    renderAdminList();
                } else {
                    alert("Wrong PIN!");
                }
                clicks = 0;
            }
        }

        function closeAdmin() {
            document.getElementById('adminModal').classList.add('hidden');
        }

        function savePhoto() {
            const fileInput = document.getElementById('imgFile');
            const title = document.getElementById('imgTitle').value || "Mehndi Design";
            const price = document.getElementById('imgPrice').value || "₹2,000";

            if(fileInput.files && fileInput.files[0]) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    gallery.push({ title: title, price: price, src: e.target.result });
                    localStorage.setItem('sabaGalleryData', JSON.stringify(gallery));
                    renderGallery();
                    renderAdminList();
                    alert("Saved Successfully!");
                    fileInput.value = "";
                    document.getElementById('imgTitle').value = "";
                    document.getElementById('imgPrice').value = "";
                }
                reader.readAsDataURL(fileInput.files[0]);
            } else {
                alert("Please select an image file first!");
            }
        }

        function renderGallery() {
            let html = "";
            gallery.forEach(item => {
                html += `<div class="bg-gray-800 rounded-lg overflow-hidden border border-gray-700 shadow-lg">
                            <img src="${item.src}" class="w-full h-56 object-cover">
                            <div class="p-4 text-center">
                                <h4 class="text-lg font-bold text-yellow-400">${item.title}</h4>
                                <p class="text-xl font-semibold text-white mt-1">${item.price}</p>
                            </div>
                         </div>`;
            });
            document.getElementById('galleryGrid').innerHTML = html;
        }

        function renderAdminList() {
            let html = "";
            gallery.forEach((item, index) => {
                html += `<div class="flex justify-between items-center bg-gray-900 p-2 rounded text-xs">
                            <span>${item.title}</span>
                            <button onclick="deleteItem(${index})" class="bg-red-500 text-white px-2 py-1 rounded">Delete</button>
                         </div>`;
            });
            document.getElementById('adminList').innerHTML = html;
        }

        function deleteItem(index) {
            if(confirm("Delete this photo?")) {
                gallery.splice(index, 1);
                localStorage.setItem('sabaGalleryData', JSON.stringify(gallery));
                renderGallery();
                renderAdminList();
            }
        }

        renderGallery();
    </script>
</body>
</html>
